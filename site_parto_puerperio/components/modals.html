<!-- ==================== MODALS & LIGHTBOXES ==================== -->
  
  <!-- 1. IMAGE LIGHTBOX MODAL -->
  <div id="image-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/90 backdrop-blur-md p-4 sm:p-8" onclick="closeLightbox()">
    <div class="relative max-w-5xl w-full bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl" onclick="event.stopPropagation()">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <h4 id="lightbox-title" class="text-sm sm:text-base font-black text-white">Imagem Médica</h4>
        <button onclick="closeLightbox()" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition-colors">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="p-2 sm:p-4 flex items-center justify-center bg-black/40">
        <img id="lightbox-img" src="" alt="Imagem Médica" class="max-w-full max-h-[70vh] object-contain rounded-xl shadow-lg">
      </div>
      <div class="p-4 bg-slate-900 border-t border-slate-800 text-xs text-slate-300">
        <p id="lightbox-caption" class="leading-relaxed"></p>
      </div>
    </div>
  </div>

  <!-- 2. QUICK SEARCH MODAL (Ctrl+K) -->
  <div id="search-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
    <div class="relative max-w-xl w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center gap-3">
        <i class="fa-solid fa-magnifying-glass text-teal-500"></i>
        <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Buscar por tema (ex: McRoberts, HPP, Partograma, Lóquios)..." class="w-full bg-transparent text-slate-900 dark:text-white font-medium text-sm outline-none">
        <button onclick="closeSearchModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
          <kbd class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800">ESC</kbd>
        </button>
      </div>
      <div id="search-results" class="p-3 max-h-80 overflow-y-auto space-y-1">
        <p class="text-xs text-slate-400 text-center py-6">Digite um termo para pesquisar instantaneamente no guia...</p>
      </div>
    </div>
  </div>

  <!-- Main JavaScript App Logic -->
  <script src="assets/js/app.js"></script>

  <!-- Botão Flutuante Voltar ao Topo (FAB) -->
  <button id="fab-back-to-top" type="button" aria-label="Voltar ao topo da página" title="Voltar ao topo" 
    class="fab-hidden p-3 rounded-full bg-teal-600 hover:bg-teal-700 active:scale-95 text-white shadow-xl shadow-teal-600/30 border border-white/20 flex items-center justify-center transition-all cursor-pointer">
    <i class="fa-solid fa-arrow-up text-base"></i>
  </button>

  <!-- Botão Flutuante de Retorno ao Hub Master (8 Portais) -->
  <a href="../index.html" title="Voltar ao Dashboard Central (8 Portais)" 
     style="position:fixed;bottom:1.25rem;left:1.25rem;z-index:45;display:inline-flex;align-items:center;gap:0.45rem;padding:0.55rem 0.95rem;border-radius:9999px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#ffffff;font-family:'Inter',sans-serif;font-size:0.75rem;font-weight:700;text-decoration:none;box-shadow:0 10px 25px -5px rgba(79,70,229,0.45);border:1px solid rgba(255,255,255,0.25);transition:transform 0.2s ease,box-shadow 0.2s ease;"
     onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
    <span>🏠 Hub Central (8 Portais)</span>
  </a>
</body>
</html>
